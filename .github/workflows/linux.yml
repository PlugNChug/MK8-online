name: Linux x86-64 packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MK8_UPDATE_REPO: ${{ github.repository }}
      MK8_RELAY_URL: ${{ vars.MK8_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld llvm cmake pkg-config zstd file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libarchive-tools \
            libvulkan-dev libshaderc-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdecor-0-dev libudev-dev
      - name: Rust checks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked
      - name: Prepare pinned sources and compiler dependencies
        run: |
          python scripts/fetch-upstream.py
          python scripts/setup-linux.py
      - name: Pipeline and native ELF tests
        run: |
          local/python/bin/python -m unittest discover -s tests -p test_pipeline.py
          local/python/bin/python -m unittest discover -s tests -p test_linux_elf.py
      - name: Build and verify packages
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/release-linux.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/release-linux.py
          fi
          python scripts/smoke-linux-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/dist/*-linux-x86_64.AppImage
            target/dist/*-linux-x86_64.AppImage.sha256
            target/dist/*-linux-x86_64.tar.gz
            target/dist/*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
