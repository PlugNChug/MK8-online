name: Verify released Linux launcher with noexec tmp
on:
  push:
    branches: [codex/qa-linux-noexec-147]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download verified 0.6.3 release
        run: |
          mkdir qa
          cd qa
          base=https://github.com/Vnnc1/MK8-online/releases/download/v0.6.3/MK8-online-0.6.3-linux-x86_64
          curl -fsSL "$base.AppImage" -o Launcher.AppImage
          echo 'b05865c21927700df0bc153dc1652d032203240de30ddb1c4cbbc6ff743d3059  Launcher.AppImage' | sha256sum -c -
          chmod +x Launcher.AppImage
          curl -fsSL "$base.tar.gz" -o Launcher.tar.gz
          echo '57bbeb72f8657c4dfd31bfbbfb93c7ab1a6d4565ae99654c23f86368ce9ca124  Launcher.tar.gz' | sha256sum -c -
          tar -xzf Launcher.tar.gz
      - name: Test the stock Steam Headless image from the Unraid template
        env:
          IMAGE: josh5/steam-headless@sha256:c60f4d7243a4d94515f722441fff90b752413bf6a45bb221c9a4ed55bc4d9108
        run: |
          set -eu
          docker pull "$IMAGE"
          mkdir -p "$RUNNER_TEMP/x-tools"
          (cd "$RUNNER_TEMP/x-tools" && apt-get download xdotool libxdo3 && for f in *.deb; do dpkg-deb -x "$f" .; done)
          export PATH="$RUNNER_TEMP/x-tools/usr/bin:$PATH" LD_LIBRARY_PATH="$RUNNER_TEMP/x-tools/usr/lib/x86_64-linux-gnu"
          Xvfb :88 -ac -screen 0 1280x720x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          export DISPLAY=:88
          for i in {1..20}; do if xdotool getdisplaygeometry > /dev/null 2>&1; then break; fi; sleep 1; done
          xdotool getdisplaygeometry
          for stage in stock repaired; do
            image="$IMAGE"
            if [ "$stage" = repaired ]; then
              docker build -t steam-qa - <<EOF
          FROM $IMAGE
          USER root
          RUN dnf --repo=fedora --repo=updates install -y webkit2gtk4.1 bsdtar
          EOF
              image=steam-qa
            fi
            mkdir -m 700 "qa/$stage" "qa/$stage/tmp"
            docker run --rm --network none --user "$(id -u):$(id -g)" --entrypoint bash "$image" -c 'cat /etc/os-release; command -v bsdtar; ldconfig -p | grep -E "libwebkit2gtk-4.1|libgtk-3" || true'
            docker run --rm --name "mk8-qa-147-$stage" --network none --user "$(id -u):$(id -g)" --entrypoint bash \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 -v /tmp/.X11-unix:/tmp/.X11-unix:ro \
              -v "$PWD/qa/Launcher.AppImage:/release/Launcher.AppImage:ro" -v "$PWD/qa/$stage:/home/qa" \
              -e DISPLAY -e HOME=/home/qa -e TMPDIR=/home/qa/tmp -e APPIMAGE_EXTRACT_AND_RUN=1 "$image" -c \
              'findmnt -no OPTIONS /tmp; cd "$HOME"; exec /release/Launcher.AppImage' >"qa/$stage.out" 2>&1 &
            job=$!
            ok=0
            for i in {1..75}; do
              if xdotool search --onlyvisible --name MK8 > /dev/null && find "qa/$stage" -name launcher.json -print -quit | grep -q .; then ok=1; break; fi
              if grep -Eq 'MK8-online: (No such file|Permission denied)|error while loading shared libraries' "qa/$stage.out"; then break; fi
              if ! kill -0 "$job" 2>/dev/null; then break; fi
              sleep 1
            done
            sed -E 's#http://127\.0\.0\.1:[^ ]+#<loopback>#g' "qa/$stage.out"
            if [ "$ok" = 1 ]; then echo "$stage image displayed the release launcher"; docker stop -t 1 "mk8-qa-147-$stage"; wait "$job" || true; break; fi
            if kill -0 "$job" 2>/dev/null; then echo "No working window"; docker stop -t 1 "mk8-qa-147-$stage"; fi
            wait "$job" || echo "$stage launcher exited with $?"
            if [ "$stage" = repaired ]; then exit 1; fi
          done
      - name: Prepare Ubuntu runtime
        run: |
          docker build -t mk8-qa - <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 libarchive-tools libwebkit2gtk-4.1-0 libgtk-3-0t64 libayatana-appindicator3-1 ca-certificates xvfb xauth xdotool dbus-x11
          EOF
      - name: Exercise both packages under noexec as a regular user
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,noexec,nosuid,nodev,mode=1777 -e HOME=/work/qa -v "$PWD:/work" -w /work mk8-qa bash -eu -o pipefail -c '
            findmnt -no OPTIONS /tmp | tr , "\n" | grep -x noexec
            ldd qa/MK8-online/usr/bin/Launcher | tee qa/ldd.txt
            if grep -q "not found" qa/ldd.txt; then exit 1; fi
            export PYTHONPATH=/work/scripts
            mkdir -m 700 qa/scratch qa/image-smoke qa/tar-smoke
            export TMPDIR=/work/qa/scratch
            python3 - <<"PY"
          import os, subprocess, json, time, urllib.request
          from pathlib import Path
          qa = Path("qa").resolve()
          for path, args, state in [("MK8-online/AppRun", [], "tar-smoke"), ("Launcher.AppImage", ["--appimage-extract-and-run"], "image-smoke")]:
              state = qa / state
              env = dict(os.environ, XDG_DATA_HOME=str(state / "xdg"))
              child = subprocess.Popen([qa / path, *args, "--headless", "--data-dir", state], env=env)
              try:
                  end = time.monotonic() + 60
                  while not (state / "launcher.json").exists():
                      if child.poll() is not None or time.monotonic() > end:
                          raise RuntimeError(f"{path} failed to start: {child.poll()}")
                      time.sleep(0.1)
                  url = json.loads((state / "launcher.json").read_text())["url"]
                  assert b"MK8-online" in urllib.request.urlopen(url, timeout=15).read()
                  importer, = (state / "xdg").rglob("mk8-import.dll")
                  assert subprocess.run([importer.parent / "dotnet/dotnet", importer], env=env, timeout=30).returncode == 2
              finally:
                  child.terminate()
                  child.wait(timeout=10)
              print(path, "served the launcher and ran the importer", flush=True)
          PY
            export APPIMAGE_EXTRACT_AND_RUN=1 XDG_DATA_HOME=/work/qa/gui-xdg
            dbus-run-session -- xvfb-run -a bash -eu -c "
              /work/qa/Launcher.AppImage > /work/qa/gui.log 2>&1 &
              pid=\$!
              trap \"kill \$pid 2>/dev/null || true; cat /work/qa/gui.log\" EXIT
              for i in {1..40}; do
                if xdotool search --onlyvisible --name MK8 | head -1 | grep -q .; then
                  echo Released AppImage displayed a native window; exit 0
                fi
                kill -0 \$pid || exit 1
                sleep 1
              done
              exit 1
            "
          '
