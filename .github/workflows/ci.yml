# Checks every push and pull request. Native runtime tests skip without the local compiler (scripts/setup-native.py).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check documentation-only changes
        id: paths
        shell: python3 {0}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess

          base, head = os.environ["PR_BASE"], os.environ["PR_HEAD"]
          parents = subprocess.check_output(["git", "show", "-s", "--format=%P", "HEAD"], text=True)
          if parents.split() != [base, head]:
              raise SystemExit(0)
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"
          ]).split(b"\0")) - {b""}
          # Release notes and license files are packaging inputs.
          docs = {b"AGENTS.md", b"README.md", b"README.pt-BR.md", b"CONTRIBUTING.md",
                  b"docs/pt-BR/CONTRIBUTING.md"}
          if changed and changed <= docs:
              subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print("docs_only=true", file=output)

  windows-ffmpeg:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/windows-ffmpeg.yml
    with:
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}

  windows:
    needs: [changes, windows-ffmpeg]
    if: ${{ !cancelled() && needs.windows-ffmpeg.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Upstream sources
        run: python scripts/fetch-upstream.py
      - name: Python tool dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --require-hashes
          -r upstream/smm2recomp/recomp/tools/requirements-gen.txt -r toolchain/requirements-host.txt
      - name: Pipeline, DLC and Windows runtime regressions
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v test_pipeline test_import_mk8 test_dlc test_package_payload
          test_runtime_windows_paths test_vulkan_loader_shim
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg
      - name: Prepare Windows compiler and headers
        run: |
          python scripts/setup-native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/setup-runtime-deps.py
      - name: Start the packaged portable launcher and verify its host key
        run: |
          python scripts/package-launcher.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/smoke-windows-portable.py

  linux:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/linux.yml
    with:
      docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
