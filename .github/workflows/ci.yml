# Checks every push and pull request. Native runtime tests skip without the local compiler (scripts/setup-native.py).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  windows-ffmpeg:
    uses: ./.github/workflows/windows-ffmpeg.yml

  windows:
    needs: windows-ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Upstream sources
        run: python scripts/fetch-upstream.py
      - name: Python tool dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --require-hashes
          -r upstream/smm2recomp/recomp/tools/requirements-gen.txt -r toolchain/requirements-host.txt
      - name: Pipeline, DLC and Windows runtime regressions
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest -v test_pipeline test_import_mk8 test_dlc test_package_payload
          test_runtime_windows_paths test_vulkan_loader_shim
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg
      - name: Prepare Windows compiler and headers
        run: |
          python scripts/setup-native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/setup-runtime-deps.py
      - name: Start the packaged portable launcher and verify its host key
        run: |
          python scripts/package-launcher.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/smoke-windows-portable.py

  linux:
    uses: ./.github/workflows/linux.yml
