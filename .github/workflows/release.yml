# Builds Windows and Linux packages before publishing a tagged GitHub Release.
# Suffixed tags and v0.3.0 are experimental pre-releases; the updater offers both release types.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      MK8_UPDATE_REPO: ${{ github.repository }}
      MK8_RELAY_URL: ${{ vars.MK8_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Upstream sources
        run: python scripts/fetch-upstream.py
      - name: Python tool dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --require-hashes
          -r upstream/smm2recomp/recomp/tools/requirements-gen.txt -r toolchain/requirements-host.txt
      - name: Build setup
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          if ($tag) { python scripts/release.py --tag $tag } else { python scripts/release.py }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: target/dist/*
          if-no-files-found: error

  linux:
    uses: ./.github/workflows/linux.yml

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Release information
        id: release
        shell: bash
        run: |
          printf 'title=%s\n' "$(tr -d '\r\n' < dist/release-title.txt)" >> "$GITHUB_OUTPUT"
          cat >> dist/release-notes.md <<'NOTES'

          ### Linux x86-64

          Download the AppImage or extract the tarball and run `MK8-online/AppRun`.
          Both packages prepare the game locally. Each download has a matching SHA-256 file.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.title }}
          prerelease: ${{ contains(github.ref_name, '-') || github.ref_name == 'v0.3.0' }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256
            dist/*-portable.zip
            dist/*-portable.zip.sha256
            dist/ffmpeg-9.0.2.tar.xz
            dist/build-ffmpeg.sh
            dist/*-linux-x86_64.AppImage
            dist/*-linux-x86_64.AppImage.sha256
            dist/*-linux-x86_64.tar.gz
            dist/*-linux-x86_64.tar.gz.sha256
