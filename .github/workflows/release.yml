# Builds Windows and Linux packages before publishing a tagged GitHub Release.
# Suffixed tags and v0.3.0 are experimental pre-releases; the updater offers both release types.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ffmpeg:
    uses: ./.github/workflows/windows-ffmpeg.yml

  windows:
    needs: windows-ffmpeg
    runs-on: windows-latest
    env:
      MK8_UPDATE_REPO: ${{ github.repository }}
      MK8_RELAY_URL: ${{ vars.MK8_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Upstream sources
        run: python scripts/fetch-upstream.py
      - name: Python tool dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --require-hashes
          -r upstream/smm2recomp/recomp/tools/requirements-gen.txt -r toolchain/requirements-host.txt
      - uses: actions/download-artifact@v4
        with:
          name: windows-ffmpeg
      - name: Prepare Windows compiler and headers
        run: |
          python scripts/setup-native.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/setup-runtime-deps.py
      - name: Build setup
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          if ($tag) { python scripts/release.py --tag $tag } else { python scripts/release.py }
      - run: python scripts/smoke-windows-portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: target/dist/*
          if-no-files-found: error

  linux:
    uses: ./.github/workflows/linux.yml

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - name: Release information
        id: release
        shell: bash
        run: |
          printf 'title=%s\n' "$(tr -d '\r\n' < dist/release-title.txt)" >> "$GITHUB_OUTPUT"
          cd dist
          for file in *-setup.exe *-portable.zip *-linux-x86_64.AppImage *-linux-x86_64.tar.gz; do
            test -s "$file"
            sha256sum --check "$file.sha256"
          done
      - name: Publish complete download set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          cd dist
          assets=(*-setup.exe *-portable.zip *-linux-x86_64.AppImage *-linux-x86_64.tar.gz
                  *.sha256 ffmpeg-9.0.2.tar.xz build-ffmpeg.sh)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Manually tested packages may already be public. Verify the published files in place.
            for asset in "${assets[@]}"; do
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p "$asset" -D published
            done
            cd published
            sha256sum --check ./*.sha256
          else
            flags=()
            if [[ $GITHUB_REF_NAME == *-* || $GITHUB_REF_NAME == v0.3.0 ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md "${flags[@]}" "${assets[@]}"
          fi
